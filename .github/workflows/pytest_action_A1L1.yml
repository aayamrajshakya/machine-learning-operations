name: Testing with Pytest
on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: 3.11

            - name: Install dependencies
              run: pip install -r Assignment01/Lab01/deps.txt

            - name: Run tests and generate XML report
              run: pytest Assignment01/Lab01/test/test_pytest.py --junitxml=Assignment01/Lab01/test/pytest-report.xml
              continue-on-error: false

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: test-results
                path: Assignment01/Lab01/test/pytest-report.xml

            - name: Notify on success
              if: success()
              run: echo "Tests passed successfully"

            - name: Notify on failure
              if: failure()
              run: echo "Tests failed"
